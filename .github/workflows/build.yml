name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Show tool versions
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0|platform-tools' || true

      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK file
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          test -s "$APK"

          echo "APK size: $(stat -c%s "$APK") bytes"
          sha256sum "$APK" | tee apk.sha256

          echo "Checking APK ZIP structure..."
          unzip -t "$APK"

          echo "Checking required APK entries..."
          unzip -l "$APK" | grep -E '(^|[[:space:]])AndroidManifest.xml$|classes(2)?\.dex$|resources\.arsc$'

      - name: Verify APK package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"

          echo "Reading package metadata..."
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | tee apk-badging.txt

          grep -q '^package: name=' apk-badging.txt
          grep -q "^minSdkVersion:'" apk-badging.txt
          grep -q "^targetSdkVersion:'" apk-badging.txt

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"

          echo "Verifying APK signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Final APK sanity check
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test "$(stat -c%s "$APK")" -gt 100000
          test "$(unzip -t "$APK" >/dev/null 2>&1; echo $?)" -eq 0

          echo "APK verification passed. Safe to upload."
          sha256sum "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: keepj-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
